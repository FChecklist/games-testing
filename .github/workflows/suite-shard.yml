# Smoke-suite shards on free GitHub Actions. Offline, in-process, no secrets, no network calls to any product.
# Code under test is checked out from PUBLIC repos only (moneypenny, monopoly). Each job = one seed range; results = JSON artifacts.
name: suite-smoke-shard
on:
  workflow_dispatch:
    inputs:
      suite: { description: 'mp | mathbulk | monopoly | tambola | tambola2 | bingo | snakes | luckydraw | ttt | luck', default: 'mp' }
      seed: { default: 'G1' }
      shards: { description: 'parallel jobs (max 20)', default: '10' }
      per_shard: { description: 'cases per job', default: '20000' }
permissions: { contents: read }
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs: { shards: '${{ steps.m.outputs.shards }}' }
    steps:
      - id: m
        run: node -e 'const n=Math.min(20,Math.max(1,+"${{ inputs.shards }}"));console.log("shards="+JSON.stringify([...Array(n).keys()]))' >> "$GITHUB_OUTPUT"
  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy: { fail-fast: false, max-parallel: 10, matrix: { shard: '${{ fromJSON(needs.plan.outputs.shards) }}' } }
    steps:
      - uses: actions/checkout@v4
        with: { path: harness }
      - uses: actions/checkout@v4
        with: { repository: FChecklist/moneypenny, path: repos/moneypenny }
      - uses: actions/checkout@v4
        with: { repository: FChecklist/monopoly, path: repos/monopoly }
      - uses: actions/checkout@v4
        with: { repository: FChecklist/corporate-tambola, path: repos/corporate-tambola }
      - uses: actions/checkout@v4
        with: { repository: FChecklist/corporate-bingo, path: repos/corporate-bingo }
      - uses: actions/checkout@v4
        with: { repository: FChecklist/corporate-snakes-and-ladders, path: repos/corporate-snakes-and-ladders }
      - uses: actions/checkout@v4
        with: { repository: FChecklist/corporate-tic-tac-toe, path: repos/corporate-tic-tac-toe }
      - uses: actions/checkout@v4
        with: { repository: FChecklist/corporate-luck-by-chance, path: repos/corporate-luck-by-chance }
      - uses: actions/checkout@v4
        with: { repository: FChecklist/corporate-luckydraw, ref: feat/luckydraw-on-engine-2026-10-31, path: repos/corporate-luckydraw }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: record versions
        run: |
          echo "moneypenny $(git -C repos/moneypenny rev-parse --short HEAD)" | tee out-versions.txt
          echo "monopoly $(git -C repos/monopoly rev-parse --short HEAD)" | tee -a out-versions.txt
          for r in corporate-tambola corporate-bingo corporate-snakes-and-ladders corporate-tic-tac-toe corporate-luck-by-chance corporate-luckydraw; do echo "$r $(git -C repos/$r rev-parse --short HEAD)" | tee -a out-versions.txt; done
      - name: tambola deps (pinned, npm registry only)
        if: inputs.suite != 'mp' && inputs.suite != 'mathbulk' && inputs.suite != 'monopoly'
        run: |
          mkdir deps && cd deps && npm init -y >/dev/null && npm i --no-audit --no-fund libphonenumber-js@1.13.15 @noble/curves@1.9.7 @noble/hashes@1.8.0 esbuild@0.25.0
      - name: run shard
        working-directory: harness/suite-smoke
        env:
          SUITE_ROOT: ${{ github.workspace }}/repos
          TAMBOLA_NODE_MODULES: ${{ github.workspace }}/deps/node_modules
          TS_ESBUILD_DIR: ${{ github.workspace }}/deps/node_modules
          SHARD: ${{ matrix.shard }}
          PER: ${{ inputs.per_shard }}
        run: |
          export RANGE="$((SHARD * PER))-$(((SHARD + 1) * PER))"
          node run-suite.mjs "${{ inputs.suite }}" "${{ inputs.seed }}" 0 "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: |
            out/*.summary.json
            out-versions.txt
          retention-days: 14
  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with: { path: shards }
      - run: |
          node -e 'const fs=require("fs"),p=require("path");let c=0,f=0,k=0,n=0;const walk=(d)=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const q=p.join(d,e.name);if(e.isDirectory())walk(q);else if(e.name.endsWith(".summary.json")){const j=JSON.parse(fs.readFileSync(q));c+=j.cases;f+=j.failed;k+=j.checks;n++}else if(e.name==="out-versions.txt")console.log(fs.readFileSync(q,"utf8").trim())}};walk("shards");console.log(JSON.stringify({shards_reported:n,cases:c,failed:f,checks:k}));if(f||!n)process.exit(1)'
